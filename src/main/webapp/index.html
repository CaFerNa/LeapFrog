<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Leap Frog</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/favicon-16x16.png">
    <script src="wasm/leapfrog.wasm-runtime.js"></script>
    <script src="wasm/leapfrog-api.js"></script>
</head>
<body>
<h3 style="text-align: center; width: 80%; margin: 20px 0;">LEAPFROG</h3>
<div id="display" style="padding: 20px; width: 80%; box-sizing: border-box;">
    <em>Esperando carga...</em>
</div>

<script>
    // 1. Iniciamos la API al cargar la página
    window.onload = async () => {
        await WasmAPI.init('wasm/leapfrog.wasm');
        document.getElementById('display').innerHTML = WasmAPI.runFunction (OPS.REINICIAR , OPS.REINICIAR);
        document.getElementById('display').onclick = function (event) {
            if (event.target.type === 'button') {
                let id = event.target.id;
                let numero = parseInt(id);
                document.getElementById('display').innerHTML = WasmAPI.runFunction(numero);
            }
        }
    }
</script>
</body>
</html>
